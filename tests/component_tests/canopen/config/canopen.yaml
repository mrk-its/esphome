esphome:
  name: canopen-test

esp32:
  board: esp32dev

logger:

canbus:
  - platform: esp32_can
    id: can_bus
    can_id: 0
    bit_rate: 125kbps
    tx_pin: GPIO4
    rx_pin: GPIO5

canopen:
  - id: canopen_node
    canbus_id: can_bus
    node_id: 0x10
    heartbeat_interval: 2s
    heartbeat_clients:
      - node_id: 0x01
        timeout: 3s
      - node_id: 0x02
        timeout: 500ms
    on_node_event:
      - logger.log: "node event"
