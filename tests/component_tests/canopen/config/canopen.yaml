esphome:
  name: canopen-test

esp32:
  board: esp32dev

logger:

canbus:
  - platform: esp32_can
    id: can_bus
    can_id: 0
    bit_rate: 125kbps
    tx_pin: GPIO4
    rx_pin: GPIO5

canopen:
  - id: canopen_node
    canbus_id: can_bus
    node_id: 0x10
    heartbeat_interval: 2s
    identity:
      vendor_id: 0x12345678
      product_code: 0x2A
    hardware_version: rev B
    nmt_startup: pre_operational
    on_nmt_state_change:
      - logger.log: "nmt state"
