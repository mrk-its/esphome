canopen:
  - id: canopen_node
    canbus_id: can_bus
    node_id: 0x10
    heartbeat_interval: 1s
    heartbeat_clients:
      - node_id: 0x01
        timeout: 3s
      - node_id: 0x02
        timeout: 5s
    identity:
      vendor_id: 0x12345678
      product_code: 0x2A
      revision_number: 0x00010002
      serial_number: 0x1
    device_name: canopen test node
    hardware_version: rev B
    software_version: "1.0"
    nmt_startup: pre_operational
    on_nmt_state_change:
      - if:
          condition:
            lambda: "return state == esphome::canopen::NMTState::NMT_STATE_PRE_OPERATIONAL;"
          then:
            - lambda: "id(canopen_node).set_nmt_state(esphome::canopen::NMTState::NMT_STATE_OPERATIONAL);"
    on_node_event:
      - logger.log:
          format: "node 0x%02x %s, %s"
          args:
            - node_id
            - esphome::canopen::node_event_to_string(event)
            - esphome::canopen::nmt_state_to_string(state)
      - if:
          condition:
            lambda: "return event == esphome::canopen::NodeEvent::NODE_EVENT_OFFLINE;"
          then:
            - logger.log: "a monitored node went offline"
    on_heartbeat:
      - lambda: |-
          if (state == esphome::canopen::NMTState::NMT_STATE_BOOTUP)
            ESP_LOGI("canopen_test", "node 0x%02x booted", node_id);
    on_emcy:
      - logger.log:
          format: "EMCY node 0x%02x: 0x%04x"
          args: [node_id, emergency.error_code]

esphome:
  on_boot:
    - lambda: |-
        id(canopen_node).add_frame_listener(0x180, 0x780, +[](void *, uint32_t can_id, const uint8_t *data, uint8_t len) {
          ESP_LOGD("canopen_test", "TPDO1 0x%03x, %u bytes", (unsigned) can_id, len);
        }, nullptr);
        const uint8_t data[2] = {0x01, 0x02};
        id(canopen_node).send_frame(0x210, data, sizeof(data));

interval:
  - interval: 10s
    then:
      - lambda: |-
          if (!id(canopen_node).is_node_online(0x01))
            ESP_LOGW("canopen_test", "node 0x01 offline");
          ESP_LOGD("canopen_test", "node 0x02: %s",
                   esphome::canopen::nmt_state_to_string(id(canopen_node).get_node_state(0x02)));

script:
  - id: canopen_sdo
    then:
      - canopen.sdo_write:
          node_id: 0x01
          index: 0x1017
          value: 1000
          size: 2
          on_success:
            - logger.log: "heartbeat time set"
          on_error:
            - logger.log:
                format: "sdo_write: %s, abort 0x%08x"
                args: ["esphome::canopen::sdo_result_to_string(result)", "(unsigned) abort_code"]
      - canopen.sdo_write:
          node_id: !lambda "return 0x02;"
          index: 0x6040
          value: !lambda "return 0x0F;"
      - canopen.nmt:
          node_id: 0
          command: start
      - lambda: |-
          id(canopen_node).read_sdo<uint32_t>(0x01, 0x1018, 1, +[](void *, const esphome::canopen::SDOReply &reply) {
            if (reply.ok())
              ESP_LOGI("canopen_test", "vendor id 0x%08x", (unsigned) reply.value);
          }, nullptr);
