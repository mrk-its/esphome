canopen:
  - id: canopen_node
    canbus_id: can_bus
    node_id: 0x10
    heartbeat_interval: 1s
    heartbeat_clients:
      - node_id: 0x01
        timeout: 3s
      - node_id: 0x02
        timeout: 5s
    on_node_event:
      - logger.log:
          format: "node 0x%02x %s, %s"
          args:
            - node_id
            - esphome::canopen::node_event_to_string(event)
            - esphome::canopen::nmt_state_to_string(state)
      - if:
          condition:
            lambda: "return event == esphome::canopen::NodeEvent::NODE_EVENT_OFFLINE;"
          then:
            - logger.log: "a monitored node went offline"
    on_heartbeat:
      - lambda: |-
          if (state == esphome::canopen::NMTState::NMT_STATE_BOOTUP)
            ESP_LOGI("canopen_test", "node 0x%02x booted", node_id);
    on_emcy:
      - logger.log:
          format: "EMCY node 0x%02x: 0x%04x"
          args: [node_id, emergency.error_code]

esphome:
  on_boot:
    - lambda: |-
        id(canopen_node).add_frame_listener(0x180, 0x780, +[](void *, uint32_t can_id, const uint8_t *data, uint8_t len) {
          ESP_LOGD("canopen_test", "TPDO1 0x%03x, %u bytes", (unsigned) can_id, len);
        }, nullptr);
        const uint8_t data[2] = {0x01, 0x02};
        id(canopen_node).send_frame(0x210, data, sizeof(data));

interval:
  - interval: 10s
    then:
      - lambda: |-
          if (!id(canopen_node).is_node_online(0x01))
            ESP_LOGW("canopen_test", "node 0x01 offline");
          ESP_LOGD("canopen_test", "node 0x02: %s",
                   esphome::canopen::nmt_state_to_string(id(canopen_node).get_node_state(0x02)));
